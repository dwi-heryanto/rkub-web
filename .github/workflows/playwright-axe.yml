name: Playwright + Axe

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright-axe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: |
          npm run dev > /tmp/next-dev.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000" >/dev/null; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          cat /tmp/next-dev.log
          exit 1

      - name: Run Playwright accessibility suite
        run: |
          npx playwright test tests/axe-fullsite.spec.ts \
            tests/accessibility.spec.ts \
            tests/button-contrast.spec.ts \
            tests/scan-button-contrasts.spec.ts \
            tests/scan-multiple-pages-contrasts.spec.ts

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

